<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de voz de prueba</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d5d9df;--acc:#0b6e4f;--accfg:#fff;--bad:#b3261e;--mute:#5d6570;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--fg:#eceef1;--card:#1b1e22;--line:#343a41;--acc:#3ecf9a;--accfg:#06241a;--bad:#ff8a80;--mute:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto}
h1{font-size:1.25rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row input[type=checkbox]{width:auto}
.row label{margin:0;color:var(--fg);font-size:.95rem}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:600 1.05rem system-ui,sans-serif}
button.on{background:var(--bad);color:#fff}
#estado{margin-top:12px;font-weight:600}
#live{min-height:1.5em;color:var(--mute);font-style:italic}
#err{color:var(--bad);margin-top:8px;white-space:pre-wrap}
#log{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.m b{display:block;font-size:.8rem;color:var(--mute);font-weight:600}
.m.ia{border-color:var(--acc)}
</style>
</head>
<body>
<h1>Agente de voz de prueba</h1>

<label for="key">Clave de OpenRouter (se guarda solo en este navegador)</label>
<input id="key" type="password" autocomplete="off" placeholder="sk-or-...">

<label for="model">Modelo</label>
<input id="model" value="deepseek/deepseek-chat">

<label for="voice">Voz neuronal (Edge TTS)</label>
<input id="voice" value="es-CO-SalomeNeural">

<label for="sys">Tema y reglas del agente</label>
<textarea id="sys">Eres Laura, asistente virtual de la pizzería Don Mario. Solo hablas de horarios (lunes a domingo, 12 m a 10 pm), menú (pizzas, pastas, bebidas) y pedidos a domicilio. Si preguntan algo distinto, di con amabilidad que solo puedes ayudar con eso y vuelve al tema. Si te preguntan, di que eres un asistente virtual.</textarea>

<label for="rate">Velocidad de la voz del navegador (solo si falla la neuronal)</label>
<input id="rate" type="number" step="0.05" min="0.6" max="1.6" value="1">

<div class="row" style="margin-top:14px">
  <input id="solo" type="checkbox" checked>
  <label for="solo">Solo probar el micrófono (no usa la IA ni gasta saldo)</label>
</div>

<button id="btn">Empezar a escuchar</button>
<div id="estado">Detenido</div>
<div id="live"></div>
<div id="err"></div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const BASE = "Hablas por teléfono. Responde siempre en español, en una o dos frases cortas, con tono natural y cercano, sin listas, sin emojis y sin formato. No salgas del tema definido abajo.\n\nTEMA Y REGLAS:\n";
const SILENCE_MS = 800;
// Servicio comunitario gratuito de Edge TTS (Hugging Face Space). No verificado: si falla, se usa la voz del navegador.
// Pega aquí la URL de tu Worker de Cloudflare, por ejemplo "https://voz-agente.TUCUENTA.workers.dev". Vacío = solo voz del navegador.
const TTS_URL = "https://agencia-voz.favianrico369.workers.dev";
const TTS_TIMEOUT_MS = 6000;
let ttsOff = false, ignoreUntil = 0, echoUntil = 0, lastReply = "";
let lastT = "", rec = null, active = false, speaking = false, busy = false, retrying = false;
let history = [], buffer = "", timer = null, wake = null, audio = null;

const sk = id => id === "model" ? "av_model2" : "av_" + id;
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
["key", "model", "sys", "rate", "voice"].forEach(id => {
  const saved = store(sk(id));
  if (saved) $(id).value = saved;
  $(id).addEventListener("change", () => store(sk(id), $(id).value));
});

function setEstado(t) { $("estado").textContent = t; }
function err(t) { $("err").textContent = t; }
function log(who, text, cls, replace) {
  const first = $("log").firstChild;
  if (replace && first && first.dataset.who === who) { first.lastChild.textContent = text; return; }
  const d = document.createElement("div");
  d.dataset.who = who;
  d.className = "m " + (cls || "");
  const b = document.createElement("b"); b.textContent = who;
  const p = document.createElement("span"); p.textContent = text;
  d.append(b, p);
  $("log").prepend(d);
}

function startRec() {
  if (!SR) { err("Este navegador no tiene reconocimiento de voz. Usa Chrome en Android."); return; }
  try { if (rec) { const old = rec; rec = null; old.abort(); } } catch (e) {}
  lastT = "";
  const r = new SR();
  rec = r;
  r.lang = "es-CO";
  r.continuous = true;
  r.interimResults = true;
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) onFinal(t.trim()); else interim += t;
    }
    if (!speaking) $("live").textContent = interim;
  };
  r.onerror = e => {
    if (r !== rec) return;
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (e.error === "network") {
      setEstado("Reconectando…");
      retrying = true;
      setTimeout(() => { retrying = false; if (active) startRec(); }, 500);
      return;
    }
    let msg = "Error del micrófono: " + e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      msg += "\nEl navegador no tiene permiso de micrófono, o Android lo bloquea durante la llamada.";
    }
    err(msg);
  };
  r.onend = () => {
    if (r !== rec) return;
    lastT = "";
    if (active && !retrying) { try { r.start(); } catch (e) {} }
  };
  try { r.start(); setEstado("Escuchando…"); } catch (e) {}
}

function norm(x) {
  return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
}
function isEcho(t) {
  if (!lastReply || Date.now() > echoUntil) return false;
  const w = norm(t);
  if (w.length < 2) return false;
  const ref = new Set(norm(lastReply));
  return w.filter(x => ref.has(x)).length / w.length >= 0.75;
}

function onFinal(t) {
  if (!t || speaking || Date.now() < ignoreUntil || isEcho(t)) return;
  const cumulative = lastT && t.toLowerCase().startsWith(lastT.toLowerCase());
  lastT = t;
  if ($("solo").checked) { log("Oyó", t, "", cumulative); return; }
  buffer = cumulative ? t : (buffer + " " + t).trim();
  clearTimeout(timer);
  timer = setTimeout(send, SILENCE_MS);
}

async function send() {
  const text = buffer.trim();
  buffer = ""; lastT = "";
  if (!text || busy) return;
  if (!$("key").value.trim()) { err("Falta la clave de OpenRouter."); return; }
  history.push({ role: "user", content: text });
  log("Oyó", text);
  busy = true;
  setEstado("Pensando…");
  const t0 = performance.now();
  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("key").value.trim() },
      body: JSON.stringify({
        model: $("model").value.trim(),
        max_tokens: 100,
        messages: [{ role: "system", content: BASE + $("sys").value }, ...history.slice(-12)]
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const reply = j.choices[0].message.content.trim();
    history.push({ role: "assistant", content: reply });
    log("IA (" + Math.round(performance.now() - t0) + " ms)", reply, "ia");
    err("");
    speak(reply);
  } catch (e) {
    err("OpenRouter: " + e.message);
    if (active) setEstado("Escuchando…");
  } finally { busy = false; }
}

function finish() {
  if (!speaking) return;
  speaking = false;
  ignoreUntil = Date.now() + 700;
  echoUntil = Date.now() + 3000;
  buffer = ""; lastT = "";
  if (active) setEstado("Escuchando…");
}

async function speak(text) {
  speaking = true;
  setEstado("Hablando…");
  lastReply = text;
  if (!ttsOff && TTS_URL) {
    let a = null, url = null;
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), TTS_TIMEOUT_MS);
    try {
      const t0 = performance.now();
      const r = await fetch(TTS_URL, {
        method: "POST",
        signal: ctl.signal,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, voice: $("voice").value.trim() || "es-CO-SalomeNeural", pitch: "+0Hz", rate: "+0%" })
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const blob = await r.blob();
      if (!blob.size || blob.type.indexOf("audio") === -1) throw new Error("la respuesta no trae audio");
      url = URL.createObjectURL(blob);
      a = new Audio(url);
      audio = a;
      a.onended = a.onerror = () => { URL.revokeObjectURL(url); finish(); };
      await a.play();
      log("Voz neuronal", Math.round(performance.now() - t0) + " ms hasta iniciar el audio");
      return;
    } catch (e) {
      if (a) { a.onended = a.onerror = null; try { a.pause(); } catch (x) {} }
      if (url) URL.revokeObjectURL(url);
      ttsOff = true;
      err("Voz neuronal no disponible (" + (e.name === "AbortError" ? "tiempo agotado" : e.message) + "). Se usa la voz del navegador el resto de la llamada.");
    } finally { clearTimeout(to); }
  }
  speakNative(text);
}

function speakNative(text) {
  const vs = speechSynthesis.getVoices();
  let v = null;
  for (const p of ["es-CO", "es-MX", "es-US", "es-419", "es"]) {
    v = vs.find(x => x.lang.replace("_", "-").startsWith(p));
    if (v) break;
  }
  const u = new SpeechSynthesisUtterance(text);
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-CO";
  u.rate = parseFloat($("rate").value) || 1;
  u.onend = u.onerror = finish;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function keepAwake() {
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("btn").addEventListener("click", () => {
  if (!active) {
    active = true; err(""); history = []; buffer = ""; ttsOff = false;
    $("btn").textContent = "Detener"; $("btn").classList.add("on");
    keepAwake(); startRec();
  } else {
    active = false; speaking = false; clearTimeout(timer);
    try { rec.stop(); } catch (e) {}
    try { if (audio) audio.pause(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
    try { if (wake) wake.release(); } catch (e) {}
    $("btn").textContent = "Empezar a escuchar"; $("btn").classList.remove("on");
    setEstado("Detenido"); $("live").textContent = "";
  }
});
</script>
</body>
</html>
