<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de voz de prueba</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d5d9df;--acc:#0b6e4f;--accfg:#fff;--bad:#b3261e;--mute:#5d6570;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--fg:#eceef1;--card:#1b1e22;--line:#343a41;--acc:#3ecf9a;--accfg:#06241a;--bad:#ff8a80;--mute:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto}
h1{font-size:1.25rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row input[type=checkbox]{width:auto}
.row label{margin:0;color:var(--fg);font-size:.95rem}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:600 1.05rem system-ui,sans-serif}
button.on{background:var(--bad);color:#fff}
#estado{margin-top:12px;font-weight:600}
#live{min-height:1.5em;color:var(--mute);font-style:italic}
#err{color:var(--bad);margin-top:8px;white-space:pre-wrap}
#log{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.m b{display:block;font-size:.8rem;color:var(--mute);font-weight:600}
.m.ia{border-color:var(--acc)}
</style>
</head>
<body>
<h1>Agente de voz de prueba</h1>

<label for="key">Clave de OpenRouter (se guarda solo en este navegador)</label>
<input id="key" type="password" autocomplete="off" placeholder="sk-or-...">

<label for="model">Modelo</label>
<input id="model" value="openai/gpt-4o-mini">

<label for="voice">Voz neuronal (Edge TTS)</label>
<input id="voice" value="es-CO-SalomeNeural">

<label for="sys">Tema y reglas del agente</label>
<textarea id="sys">Eres Laura, asistente virtual de la pizzería Don Mario. Solo hablas de horarios (lunes a domingo, 12 m a 10 pm), menú (pizzas, pastas, bebidas) y pedidos a domicilio. Si preguntan algo distinto, di con amabilidad que solo puedes ayudar con eso y vuelve al tema. Si te preguntan, di que eres un asistente virtual.</textarea>

<label for="rate">Velocidad de la voz del navegador (solo si falla la neuronal)</label>
<input id="rate" type="number" step="0.05" min="0.6" max="1.6" value="1">

<div class="row" style="margin-top:14px">
  <input id="solo" type="checkbox" checked>
  <label for="solo">Solo probar el micrófono (no usa la IA ni gasta saldo)</label>
</div>
<div class="row" style="margin-top:10px">
  <input id="filler" type="checkbox" checked>
  <label for="filler">Muletillas mientras piensa (okey, un momento…)</label>
</div>
<div class="row" style="margin-top:10px">
  <input id="typing" type="checkbox" checked>
  <label for="typing">Sonido de teclado mientras piensa</label>
</div>

<button id="btn">Empezar a escuchar</button>
<div id="estado">Detenido</div>
<div id="live"></div>
<div id="err"></div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const BASE = "Hablas por teléfono. Responde siempre en español, en una o dos frases cortas, con tono natural y cercano, sin listas, sin emojis y sin formato. No salgas del tema definido abajo.\n\nTEMA Y REGLAS:\n";
const SILENCE_MS = 700;
// URL de tu Worker de Cloudflare (voz neuronal). Vacío = solo voz del navegador.
const TTS_URL = "https://agencia-voz.favianrico369.workers.dev";
const TTS_TIMEOUT_MS = 6000;
// Muletillas: se generan con la voz neuronal al pulsar "Empezar" y suenan mientras la IA piensa. Edita la lista a tu gusto.
const FILLERS = ["Okey…", "A ver…", "Mmm, a ver…", "Dame un momento…", "Un segundito…", "Claro, déjame ver…", "Espérame un momento, te confirmo…"];
const FILLER_DELAY_MS = 450;
const TYPING_VOL = 1.4;

let ttsOff = false, ignoreUntil = 0, echoUntil = 0, lastReply = "";
let lastT = "", rec = null, active = false, speaking = false, busy = false, retrying = false;
let history = [], buffer = "", timer = null, wake = null, audio = null;
let turn = 0, turnCtl = null, fillerUrls = [], lastFiller = -1, actx = null, typingTimer = null;

const sk = id => id === "model" ? "av_model3" : "av_" + id;
function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
["key", "model", "sys", "rate", "voice"].forEach(id => {
  const saved = store(sk(id));
  if (saved) $(id).value = saved;
  $(id).addEventListener("change", () => store(sk(id), $(id).value));
});
["filler", "typing"].forEach(id => {
  const saved = store("av_" + id);
  if (saved !== null) $(id).checked = saved === "1";
  $(id).addEventListener("change", () => store("av_" + id, $(id).checked ? "1" : "0"));
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
const stripEmoji = s => s.replace(/[\u{1F000}-\u{1FFFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, "");
const voiceName = () => $("voice").value.trim() || "es-CO-SalomeNeural";
function setEstado(t) { $("estado").textContent = t; }
function err(t) { $("err").textContent = t; }
function log(who, text, cls, replace) {
  const first = $("log").firstChild;
  if (replace && first && first.dataset.who === who) { first.lastChild.textContent = text; return; }
  const d = document.createElement("div");
  d.dataset.who = who;
  d.className = "m " + (cls || "");
  const b = document.createElement("b"); b.textContent = who;
  const p = document.createElement("span"); p.textContent = text;
  d.append(b, p);
  $("log").prepend(d);
}

/* ---------- Micrófono ---------- */
function startRec() {
  if (!SR) { err("Este navegador no tiene reconocimiento de voz. Usa Chrome en Android."); return; }
  try { if (rec) { const old = rec; rec = null; old.abort(); } } catch (e) {}
  lastT = "";
  const r = new SR();
  rec = r;
  r.lang = "es-CO";
  r.continuous = true;
  r.interimResults = true;
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) onFinal(t.trim()); else interim += t;
    }
    if (!speaking) $("live").textContent = interim;
  };
  r.onerror = e => {
    if (r !== rec) return;
    if (e.error === "no-speech" || e.error === "aborted") return;
    if (e.error === "network") {
      setEstado("Reconectando…");
      retrying = true;
      setTimeout(() => { retrying = false; if (active && !speaking) startRec(); }, 500);
      return;
    }
    let msg = "Error del micrófono: " + e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      msg += "\nEl navegador no tiene permiso de micrófono, o Android lo bloquea durante la llamada.";
    }
    err(msg);
  };
  r.onend = () => {
    if (r !== rec) return;
    lastT = "";
    if (active && !retrying) { try { r.start(); } catch (e) {} }
  };
  try { r.start(); setEstado("Escuchando…"); } catch (e) {}
}

// Detiene el micrófono y avisa cuando ya terminó (así no hay pitidos mientras habla la IA).
function stopRec() {
  return new Promise(res => {
    const r = rec;
    if (!r) { res(); return; }
    rec = null;
    let done = false;
    const fin = () => { if (!done) { done = true; res(); } };
    r.onend = fin;
    setTimeout(fin, 700);
    try { r.stop(); } catch (e) { fin(); }
  });
}

function norm(x) {
  return x.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(Boolean);
}
function isEcho(t) {
  if (!lastReply || Date.now() > echoUntil) return false;
  const w = norm(t);
  if (w.length < 2) return false;
  const ref = new Set(norm(lastReply));
  return w.filter(x => ref.has(x)).length / w.length >= 0.75;
}

function onFinal(t) {
  if (!t || speaking || Date.now() < ignoreUntil || isEcho(t)) return;
  const cumulative = lastT && t.toLowerCase().startsWith(lastT.toLowerCase());
  lastT = t;
  if ($("solo").checked) { log("Oyó", t, "", cumulative); return; }
  if (norm(t).join("").length < 2) return;
  buffer = cumulative ? t : (buffer + " " + t).trim();
  clearTimeout(timer);
  timer = setTimeout(send, SILENCE_MS);
}

/* ---------- Sonido de teclado (sintetizado, sin archivos) ---------- */
function audioCtx() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function click() {
  const c = audioCtx(), t = c.currentTime, len = Math.floor(c.sampleRate * 0.035);
  const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500 + Math.random() * 2500; f.Q.value = 1.1;
  const g = c.createGain(); g.gain.value = TYPING_VOL * (0.7 + Math.random() * 0.3);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
}
function startTyping() {
  if (typingTimer || !$("typing").checked) return;
  let n = 0;
  const tick = () => {
    try { click(); } catch (e) {}
    n++;
    const pause = (n % (6 + Math.floor(Math.random() * 6)) === 0) ? 350 + Math.random() * 300 : 70 + Math.random() * 130;
    typingTimer = setTimeout(tick, pause);
  };
  tick();
}
function stopTyping() { clearTimeout(typingTimer); typingTimer = null; }

/* ---------- Voz ---------- */
async function fetchTts(text) {
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), TTS_TIMEOUT_MS);
  try {
    const r = await fetch(TTS_URL, {
      method: "POST",
      signal: ctl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text, voice: voiceName(), pitch: "+0Hz", rate: "+0%" })
    });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 220));
    const blob = await r.blob();
    if (!blob.size || blob.type.indexOf("audio") === -1) throw new Error("la respuesta no trae audio");
    return URL.createObjectURL(blob);
  } finally { clearTimeout(to); }
}

// Reproduce un audio; devuelve true si sonó, false si no pudo reproducirse.
function playAudioUrl(url, text) {
  return new Promise(resolve => {
    const a = new Audio(url);
    audio = a;
    let done = false, wdl = null;
    const end = ok => {
      if (done) return;
      done = true;
      clearTimeout(wdl);
      a.onended = a.onerror = a.onpause = null;
      resolve(ok);
    };
    a.onended = () => end(true);
    a.onerror = () => end(false);
    // Si Android pausa el audio, se reanuda solo.
    a.onpause = () => {
      if (!done && !a.ended && active) setTimeout(() => { if (!done && a.paused && !a.ended) a.play().catch(() => {}); }, 250);
    };
    a.play().then(() => {
      const dur = (isFinite(a.duration) && a.duration > 0 ? a.duration * 1000 : text.length * 90) + 4000;
      wdl = setTimeout(() => { try { a.pause(); } catch (e) {} end(true); }, dur);
    }).catch(() => end(false));
  });
}

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  for (const p of ["es-CO", "es-MX", "es-US", "es-419", "es"]) {
    const v = vs.find(x => x.lang.replace("_", "-").startsWith(p));
    if (v) return v;
  }
  return null;
}
// Voz del navegador (respaldo si la neuronal falla).
function speakNativeP(text) {
  return new Promise(resolve => {
    let done = false, w = null;
    const end = () => { if (done) return; done = true; clearTimeout(w); resolve(); };
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-CO";
      u.rate = parseFloat($("rate").value) || 1;
      u.onend = u.onerror = end;
      w = setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) {} end(); }, text.length * 110 + 5000);
      speechSynthesis.speak(u);
    } catch (e) { end(); }
  });
}

// Genera las muletillas con la voz neuronal (una por una, en segundo plano).
function loadFillers() {
  if (!TTS_URL || !$("filler").checked || fillerUrls.length) return;
  (async () => {
    for (const text of FILLERS) {
      try { fillerUrls.push({ text: text, url: await fetchTts(text) }); } catch (e) { break; }
    }
  })();
}
async function playFiller() {
  if (!fillerUrls.length) return;
  let i;
  do { i = Math.floor(Math.random() * fillerUrls.length); } while (fillerUrls.length > 1 && i === lastFiller);
  lastFiller = i;
  await playAudioUrl(fillerUrls[i].url, fillerUrls[i].text);
}

/* ---------- Turno de conversación ---------- */
function endTurn(my) {
  if (my !== turn) return;
  stopTyping();
  busy = false;
  speaking = false;
  ignoreUntil = Date.now() + 500;
  echoUntil = Date.now() + 3000;
  buffer = ""; lastT = "";
  if (active) {
    setEstado("Escuchando…");
    setTimeout(() => { if (active && !speaking && my === turn) startRec(); }, 250);
  }
}

async function send() {
  const text = buffer.trim();
  buffer = ""; lastT = "";
  if (!text || busy) return;
  if (!$("key").value.trim()) { err("Falta la clave de OpenRouter."); return; }
  history.push({ role: "user", content: text });
  log("Oyó", text);
  busy = true; speaking = true;
  setEstado("Pensando…");
  const my = ++turn;
  const alive = () => active && my === turn;
  const ctl = new AbortController();
  turnCtl = ctl;
  const stopped = stopRec();
  const t0 = performance.now();
  const useFx = norm(text).length >= 4;
  let reply = "", pend = "", streamDone = false, started = false, firstReady = false;
  const chunks = [];

  // Cada frase lista se manda de inmediato a la voz, sin esperar el resto de la respuesta.
  function emit(s) {
    const clean = stripEmoji(s).trim();
    if (!clean) return;
    const audioP = (!ttsOff && TTS_URL)
      ? fetchTts(clean).catch(e => {
          if (!ttsOff) err("Voz neuronal no disponible (" + (e.name === "AbortError" ? "tiempo agotado" : e.message) + "). Se usa la voz del navegador el resto de la llamada.");
          ttsOff = true;
          return null;
        })
      : Promise.resolve(null);
    chunks.push({ text: clean, audioP: audioP });
  }
  function flush(final) {
    for (;;) {
      const minLen = chunks.length === 0 ? 14 : 28;
      const re = /(?:[.!?…]+["”')\]]*\s)|\n/g;
      let m, cut = -1;
      while ((m = re.exec(pend)) !== null) {
        const end = m.index + m[0].length;
        if (pend.slice(0, end).trim().length >= minLen) { cut = end; break; }
      }
      if (cut < 0) break;
      emit(pend.slice(0, cut));
      pend = pend.slice(cut);
    }
    if (final && pend.trim()) { emit(pend); pend = ""; }
  }

  // Muletilla y teclado mientras la respuesta no está lista.
  const fxP = (async () => {
    if (!useFx) return;
    const doFiller = $("filler").checked && fillerUrls.length > 0 && Math.random() < 0.75;
    await sleep(doFiller ? FILLER_DELAY_MS : 300);
    await stopped;
    if (!alive() || started || firstReady) return;
    if (doFiller) await playFiller();
    if (alive() && !started && !firstReady) startTyping();
  })();

  // Reproduce las frases en orden, a medida que su audio está listo.
  const consumer = (async () => {
    for (let i = 0; ; i++) {
      while (i >= chunks.length && !streamDone) { await sleep(25); if (!alive()) return; }
      if (i >= chunks.length) break;
      const item = chunks[i];
      const url = await item.audioP;
      if (!alive()) return;
      if (i === 0) {
        firstReady = true;
        log("Respuesta lista", Math.round(performance.now() - t0) + " ms desde que terminaste de hablar");
        await fxP;
        await stopped;
        if (!alive()) return;
        stopTyping();
        started = true;
        setEstado("Hablando…");
      }
      if (url) {
        const ok = await playAudioUrl(url, item.text);
        URL.revokeObjectURL(url);
        if (!alive()) return;
        if (!ok) await speakNativeP(item.text);
      } else {
        await speakNativeP(item.text);
      }
      if (!alive()) return;
    }
  })();

  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      signal: ctl.signal,
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("key").value.trim() },
      body: JSON.stringify({
        model: $("model").value.trim(),
        max_tokens: 100,
        stream: true,
        provider: { sort: "latency" },
        messages: [{ role: "system", content: BASE + $("sys").value }, ...history.slice(-12)]
      })
    });
    if (!r.ok) {
      let m = "HTTP " + r.status;
      try { const j = await r.json(); if (j.error && j.error.message) m = j.error.message; } catch (e) {}
      throw new Error(m);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let sb = "", tFirst = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      sb += dec.decode(value, { stream: true });
      let nl;
      while ((nl = sb.indexOf("\n")) >= 0) {
        const line = sb.slice(0, nl).trim();
        sb = sb.slice(nl + 1);
        if (line.indexOf("data:") !== 0) continue;
        const data = line.slice(5).trim();
        if (!data || data === "[DONE]") continue;
        let j; try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.error) throw new Error(j.error.message || "error del modelo");
        const d = j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (d) {
          if (!tFirst) tFirst = performance.now() - t0;
          reply += d; pend += d;
          flush(false);
        }
      }
    }
    flush(true);
    streamDone = true;
    reply = reply.trim();
    if (reply) history.push({ role: "assistant", content: reply });
    lastReply = stripEmoji(reply);
    log("IA (primer texto " + Math.round(tFirst) + " ms, total " + Math.round(performance.now() - t0) + " ms)", reply, "ia");
  } catch (e) {
    streamDone = true;
    if (!alive()) return;
    err("OpenRouter: " + e.message);
  }
  await Promise.all([consumer, fxP]);
  endTurn(my);
}

async function keepAwake() {
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("btn").addEventListener("click", () => {
  if (!active) {
    active = true; err(""); history = []; buffer = ""; ttsOff = false; busy = false; speaking = false; turn++;
    $("btn").textContent = "Detener"; $("btn").classList.add("on");
    try { audioCtx(); } catch (e) {}
    keepAwake(); startRec(); loadFillers();
  } else {
    active = false; speaking = false; busy = false; turn++;
    clearTimeout(timer);
    try { if (turnCtl) turnCtl.abort(); } catch (e) {}
    stopTyping();
    try { rec.stop(); } catch (e) {}
    try { if (audio) audio.pause(); } catch (e) {}
    try { speechSynthesis.cancel(); } catch (e) {}
    try { if (wake) wake.release(); } catch (e) {}
    $("btn").textContent = "Empezar a escuchar"; $("btn").classList.remove("on");
    setEstado("Detenido"); $("live").textContent = "";
  }
});
</script>
</body>
</html>
