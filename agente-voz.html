<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente de voz de prueba</title>
<style>
:root{--bg:#f6f7f9;--fg:#15171a;--card:#fff;--line:#d5d9df;--acc:#0b6e4f;--accfg:#fff;--bad:#b3261e;--mute:#5d6570;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121416;--fg:#eceef1;--card:#1b1e22;--line:#343a41;--acc:#3ecf9a;--accfg:#06241a;--bad:#ff8a80;--mute:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto}
h1{font-size:1.25rem;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:12px 0 4px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row input[type=checkbox]{width:auto}
.row label{margin:0;color:var(--fg);font-size:.95rem}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:var(--accfg);font:600 1.05rem system-ui,sans-serif}
button.on{background:var(--bad);color:#fff}
#estado{margin-top:12px;font-weight:600}
#live{min-height:1.5em;color:var(--mute);font-style:italic}
#err{color:var(--bad);margin-top:8px;white-space:pre-wrap}
#log{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.m b{display:block;font-size:.8rem;color:var(--mute);font-weight:600}
.m.ia{border-color:var(--acc)}
</style>
</head>
<body>
<h1>Agente de voz de prueba</h1>

<label for="key">Clave de OpenRouter (se guarda solo en este navegador)</label>
<input id="key" type="password" autocomplete="off" placeholder="sk-or-...">

<label for="model">Modelo</label>
<input id="model" value="openai/gpt-4o-mini">

<label for="sys">Tema y reglas del agente</label>
<textarea id="sys">Eres Laura, asistente virtual de la pizzería Don Mario. Solo hablas de horarios (lunes a domingo, 12 m a 10 pm), menú (pizzas, pastas, bebidas) y pedidos a domicilio. Si preguntan algo distinto, di con amabilidad que solo puedes ayudar con eso y vuelve al tema. Si te preguntan, di que eres un asistente virtual.</textarea>

<label for="rate">Velocidad de la voz</label>
<input id="rate" type="number" step="0.05" min="0.6" max="1.6" value="1">

<div class="row" style="margin-top:14px">
  <input id="solo" type="checkbox" checked>
  <label for="solo">Solo probar el micrófono (no usa la IA ni gasta saldo)</label>
</div>

<button id="btn">Empezar a escuchar</button>
<div id="estado">Detenido</div>
<div id="live"></div>
<div id="err"></div>
<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const BASE = "Hablas por teléfono. Responde siempre en español, en una o dos frases cortas, con tono natural y cercano, sin listas, sin emojis y sin formato. No salgas del tema definido abajo.\n\nTEMA Y REGLAS:\n";
let rec = null, active = false, speaking = false, busy = false, history = [], buffer = "", timer = null, wake = null;

function store(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
}
["key", "model", "sys", "rate"].forEach(id => {
  const saved = store("av_" + id);
  if (saved) $(id).value = saved;
  $(id).addEventListener("change", () => store("av_" + id, $(id).value));
});

function setEstado(t) { $("estado").textContent = t; }
function err(t) { $("err").textContent = t; }
function log(who, text, cls) {
  const d = document.createElement("div");
  d.className = "m " + (cls || "");
  const b = document.createElement("b"); b.textContent = who;
  const p = document.createElement("span"); p.textContent = text;
  d.append(b, p);
  $("log").prepend(d);
}

function startRec() {
  if (!SR) { err("Este navegador no tiene reconocimiento de voz. Usa Chrome en Android."); return; }
  rec = new SR();
  rec.lang = "es-CO";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) onFinal(t.trim()); else interim += t;
    }
    $("live").textContent = interim;
  };
  rec.onerror = e => {
    if (e.error === "no-speech" || e.error === "aborted") return;
    let msg = "Error del micrófono: " + e.error;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      msg += "\nEl navegador no tiene permiso de micrófono, o Android lo bloquea durante la llamada.";
    }
    err(msg);
  };
  rec.onend = () => {
    if (active && !speaking) { try { rec.start(); } catch (e) {} }
  };
  try { rec.start(); setEstado("Escuchando…"); } catch (e) {}
}

function onFinal(t) {
  if (!t || speaking) return;
  if ($("solo").checked) { log("Oyó", t); return; }
  buffer += " " + t;
  clearTimeout(timer);
  timer = setTimeout(send, 1200);
}

async function send() {
  const text = buffer.trim();
  buffer = "";
  if (!text || busy) return;
  if (!$("key").value.trim()) { err("Falta la clave de OpenRouter."); return; }
  history.push({ role: "user", content: text });
  log("Oyó", text);
  busy = true;
  setEstado("Pensando…");
  const t0 = performance.now();
  try {
    const r = await fetch("https://openrouter.ai/api/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + $("key").value.trim() },
      body: JSON.stringify({
        model: $("model").value.trim(),
        max_tokens: 120,
        messages: [{ role: "system", content: BASE + $("sys").value }, ...history.slice(-12)]
      })
    });
    const j = await r.json();
    if (!r.ok) throw new Error((j.error && j.error.message) || r.status);
    const reply = j.choices[0].message.content.trim();
    history.push({ role: "assistant", content: reply });
    log("IA (" + Math.round(performance.now() - t0) + " ms)", reply, "ia");
    err("");
    speak(reply);
  } catch (e) {
    err("OpenRouter: " + e.message);
    if (active) setEstado("Escuchando…");
  } finally { busy = false; }
}

function pickVoice() {
  const vs = speechSynthesis.getVoices();
  for (const p of ["es-CO", "es-MX", "es-US", "es-419", "es"]) {
    const v = vs.find(v => v.lang.replace("_", "-").startsWith(p));
    if (v) return v;
  }
  return null;
}

function speak(text) {
  speaking = true;
  setEstado("Hablando…");
  try { rec.stop(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "es-CO";
  u.rate = parseFloat($("rate").value) || 1;
  const done = () => { speaking = false; if (active) setTimeout(startRec, 400); };
  u.onend = done; u.onerror = done;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

async function keepAwake() {
  try { if (navigator.wakeLock) wake = await navigator.wakeLock.request("screen"); } catch (e) {}
}

$("btn").addEventListener("click", () => {
  if (!active) {
    active = true; err(""); history = []; buffer = "";
    $("btn").textContent = "Detener"; $("btn").classList.add("on");
    keepAwake(); startRec();
  } else {
    active = false; speaking = false; clearTimeout(timer);
    try { rec.stop(); } catch (e) {}
    speechSynthesis.cancel();
    try { if (wake) wake.release(); } catch (e) {}
    $("btn").textContent = "Empezar a escuchar"; $("btn").classList.remove("on");
    setEstado("Detenido"); $("live").textContent = "";
  }
});
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
